<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080">
  <defs>
    <style>
      .bg { fill: #0c1118; }
      .ribbon { fill: #344051; }
      .group { fill: #2d3848; stroke: #222b38; stroke-width: 1; }
      .label { fill: #f3f6fb; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 20px; }
      .small { fill: #d8dee8; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 15px; }
      .group-title { fill: #ffffff; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 17px; }
      .panel-title { fill: #f5f7fb; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 22px; font-weight: 600; }
      .panel-note { fill: #b8c2d2; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 16px; }
      .grid { stroke: #263244; stroke-width: 1; }
      .panel { fill: #0a0f16; stroke: #39475a; stroke-width: 2; rx: 10; }
      .wall { fill: none; stroke: #f4e000; stroke-width: 5; stroke-linecap: square; stroke-linejoin: miter; }
      .wall-thin { fill: none; stroke: #f4e000; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; }
      .open { fill: none; stroke: #00e5ff; stroke-width: 4; stroke-linecap: square; }
      .skeleton { fill: none; stroke: #58d6ff; stroke-width: 4; stroke-linecap: square; }
      .skeleton2 { fill: none; stroke: #ffffff; stroke-width: 2; stroke-dasharray: 8 7; opacity: .65; }
      .shear { fill: none; stroke: #f02b2b; stroke-width: 9; stroke-linecap: butt; }
      .beam { fill: none; stroke: #ffd21f; stroke-width: 6; stroke-linecap: butt; }
      .room1 { fill: #5cc8ff; opacity: .22; }
      .room2 { fill: #ffcc55; opacity: .24; }
      .room3 { fill: #8be070; opacity: .22; }
      .room4 { fill: #ee80ff; opacity: .22; }
      .room5 { fill: #ff7a7a; opacity: .20; }
      .callout { fill: #121b27; stroke: #90a4bd; stroke-width: 2; rx: 12; }
      .call { fill: #e9f0f8; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 15px; }
      .icon { fill: none; stroke: #e7edf6; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" class="grid" fill="none"/>
    </pattern>
    <g id="miniIcon">
      <rect x="0" y="0" width="18" height="18" rx="3" class="icon"/>
      <path d="M4 10h10M9 4v10" class="icon"/>
    </g>
    <g id="planRaw">
      <path class="wall" d="M20 85H70V35H128V55H182V30H240V85H305V35H362V85H420V150H365V220H300V170H240V235H178V170H128V220H70V150H20Z"/>
      <path class="wall-thin" d="M128 55V120H182V85M240 85V170M305 85V150H365M70 85V150H128M178 170H240"/>
      <path class="open" d="M70 35H118M182 30H220M305 35H348M365 85H410M300 220H350M70 220H120"/>
      <path class="open" d="M70 150A35 35 0 0 0 35 115M128 120A35 35 0 0 0 93 85M240 85A35 35 0 0 1 275 120M365 150A35 35 0 0 1 330 185"/>
    </g>
    <g id="planSkeleton">
      <path class="skeleton" d="M20 115H420M95 35V220M155 55V170M210 30V235M270 85V220M335 35V220"/>
      <path class="skeleton2" d="M20 85H420M20 150H420M70 35H362M70 220H350"/>
      <path class="open" d="M70 35H118M182 30H220M305 35H348M300 220H350"/>
    </g>
    <g id="planRooms">
      <path class="room1" d="M22 86H95V149H22Z"/>
      <path class="room2" d="M96 56H181V149H96Z"/>
      <path class="room3" d="M182 31H239V169H182Z"/>
      <path class="room4" d="M240 86H334V169H240Z"/>
      <path class="room5" d="M335 86H419V149H335Z"/>
      <path class="room1" d="M70 151H177V219H70Z"/>
      <path class="room2" d="M240 171H349V219H240Z"/>
      <use href="#planSkeleton"/>
    </g>
    <g id="planStructure">
      <use href="#planSkeleton"/>
      <path class="shear" d="M95 35V105M95 150V220M210 30V95M210 165V235M335 35V105M335 150V220M20 115H85M345 115H420"/>
      <path class="beam" d="M85 115H155M155 115H210M210 115H270M270 115H345M20 85H420M70 220H350M20 150H420"/>
    </g>
  </defs>

  <rect width="1800" height="1080" class="bg"/>
  <rect y="0" width="1800" height="190" class="ribbon"/>

  <g transform="translate(16,18)">
    <g>
      <rect width="210" height="154" class="group"/>
      <use href="#miniIcon" x="16" y="24"/><text x="46" y="39" class="small">框选平面图</text>
      <use href="#miniIcon" x="16" y="66"/><text x="46" y="81" class="small">清除范围</text>
      <use href="#miniIcon" x="16" y="108"/><text x="46" y="123" class="small">查看范围</text>
      <text x="72" y="166" class="group-title">1. 对象范围</text>
    </g>
    <g transform="translate(220,0)">
      <rect width="250" height="154" class="group"/>
      <use href="#miniIcon" x="16" y="24"/><text x="46" y="39" class="small">设置图层</text>
      <use href="#miniIcon" x="16" y="66"/><text x="46" y="81" class="small">仅显示输入图层</text>
      <use href="#miniIcon" x="16" y="108"/><text x="46" y="123" class="small">恢复全部图层</text>
      <text x="92" y="166" class="group-title">2. 图层设置</text>
    </g>
    <g transform="translate(480,0)">
      <rect width="270" height="154" class="group"/>
      <use href="#miniIcon" x="16" y="24"/><text x="46" y="39" class="small">提取骨架</text>
      <use href="#miniIcon" x="16" y="66"/><text x="46" y="81" class="small">提交骨架修正</text>
      <use href="#miniIcon" x="16" y="108"/><text x="46" y="123" class="small">确认骨架</text>
      <text x="102" y="166" class="group-title">3. 骨架流程</text>
    </g>
    <g transform="translate(760,0)">
      <rect width="270" height="154" class="group"/>
      <use href="#miniIcon" x="16" y="24"/><text x="46" y="39" class="small">生成结构</text>
      <use href="#miniIcon" x="16" y="66"/><text x="46" y="81" class="small">提交结构修正</text>
      <use href="#miniIcon" x="16" y="108"/><text x="46" y="123" class="small">生成YDB</text>
      <text x="102" y="166" class="group-title">4. 结构流程</text>
    </g>
    <g transform="translate(1040,0)">
      <rect width="330" height="154" class="group"/>
      <use href="#miniIcon" x="16" y="24"/><text x="46" y="39" class="small">显示骨架</text>
      <use href="#miniIcon" x="16" y="66"/><text x="46" y="81" class="small">显示分区</text>
      <use href="#miniIcon" x="16" y="108"/><text x="46" y="123" class="small">显示结构</text>
      <use href="#miniIcon" x="172" y="24"/><text x="202" y="39" class="small">定位问题</text>
      <text x="128" y="166" class="group-title">5. 显示检查</text>
    </g>
    <g transform="translate(1380,0)">
      <rect width="390" height="154" class="group"/>
      <use href="#miniIcon" x="16" y="24"/><text x="46" y="39" class="small">下载YDB</text>
      <use href="#miniIcon" x="16" y="66"/><text x="46" y="81" class="small">写回CAD</text>
      <use href="#miniIcon" x="16" y="108"/><text x="46" y="123" class="small">导出报告</text>
      <use href="#miniIcon" x="172" y="24"/><text x="202" y="39" class="small">插件信息</text>
      <text x="158" y="166" class="group-title">6. 输出信息</text>
    </g>
  </g>

  <rect x="0" y="190" width="1800" height="890" fill="url(#grid)"/>
  <text x="38" y="232" class="label">剪力墙智能设计工作流参考</text>
  <text x="38" y="258" class="panel-note">插件只负责业务节点；线段修改由 CAD 原生命令完成，修改后提交后端重新检查</text>

  <g transform="translate(38,288)">
    <g>
      <rect width="545" height="315" class="panel"/>
      <text x="22" y="36" class="panel-title">1 框选平面图</text>
      <text x="22" y="62" class="panel-note">在一个 DWG 中限定本次操作范围</text>
      <g transform="translate(48,62) scale(1.05)"><use href="#planRaw"/></g>
      <rect x="50" y="70" width="438" height="250" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="12 8"/>
    </g>
    <g transform="translate(585,0)">
      <rect width="545" height="315" class="panel"/>
      <text x="22" y="36" class="panel-title">2 提取骨架</text>
      <text x="22" y="62" class="panel-note">前端读取图层图元并调用后端</text>
      <g transform="translate(48,62) scale(1.05)"><use href="#planSkeleton"/></g>
    </g>
    <g transform="translate(1170,0)">
      <rect width="545" height="315" class="panel"/>
      <text x="22" y="36" class="panel-title">3 骨架修正迭代</text>
      <text x="22" y="62" class="panel-note">工程师修改结果图层，再提交重新分区</text>
      <g transform="translate(48,62) scale(1.05)"><use href="#planSkeleton"/></g>
      <rect x="318" y="64" width="170" height="92" class="callout"/>
      <text x="336" y="92" class="call">补全线段</text>
      <text x="336" y="120" class="call">删除线段</text>
      <text x="336" y="148" class="call">延长相交</text>
      <path class="skeleton" d="M351 204H476M414 172V254"/>
      <path class="open" d="M416 204H481"/>
    </g>
  </g>

  <g transform="translate(38,640)">
    <g>
      <rect width="545" height="315" class="panel"/>
      <text x="22" y="36" class="panel-title">4 房间分区检查</text>
      <text x="22" y="62" class="panel-note">不同颜色表示闭合房间，辅助判断骨架质量</text>
      <g transform="translate(48,62) scale(1.05)"><use href="#planRooms"/></g>
    </g>
    <g transform="translate(585,0)">
      <rect width="545" height="315" class="panel"/>
      <text x="22" y="36" class="panel-title">5 结构布置</text>
      <text x="22" y="62" class="panel-note">红色剪力墙，黄色梁，并提示未闭合位置</text>
      <g transform="translate(48,62) scale(1.05)"><use href="#planStructure"/></g>
    </g>
    <g transform="translate(1170,0)">
      <rect width="545" height="315" class="panel"/>
      <text x="22" y="36" class="panel-title">6 结构修正与输出</text>
      <text x="22" y="62" class="panel-note">提交修正，检查通过后生成 YDB</text>
      <g transform="translate(48,62) scale(1.05)"><use href="#planStructure"/></g>
      <rect x="314" y="64" width="180" height="92" class="callout"/>
      <text x="332" y="92" class="call">修正剪力墙</text>
      <text x="332" y="120" class="call">补梁</text>
      <text x="332" y="148" class="call">延长搭接</text>
      <path class="shear" d="M351 214V162"/>
      <path class="beam" d="M351 214H481M406 162H481"/>
    </g>
  </g>
</svg>
