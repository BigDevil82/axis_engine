<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <style>
      .bg { fill: #0c1118; }
      .lane { fill: #121a26; stroke: #34445a; stroke-width: 2; rx: 12; }
      .head { fill: #344051; stroke: #44566e; stroke-width: 2; rx: 10; }
      .title { fill: #f5f8fc; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 26px; font-weight: 600; }
      .subtitle { fill: #c5cedb; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 18px; }
      .text { fill: #eef3f9; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 19px; }
      .small { fill: #c4cedb; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 16px; }
      .step { fill: #eaf1f8; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 17px; font-weight: 600; }
      .arrow { stroke: #6ed7ff; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .return { stroke: #ffd45a; stroke-width: 3; fill: none; marker-end: url(#arrowReturn); }
      .local { stroke: #98a7ba; stroke-width: 2.5; fill: none; marker-end: url(#arrowLocal); }
      .life { stroke: #506277; stroke-width: 2; stroke-dasharray: 8 8; }
      .loop { fill: none; stroke: #7f91a8; stroke-width: 2; stroke-dasharray: 10 7; rx: 12; }
      .note { fill: #162333; stroke: #4a617b; stroke-width: 2; rx: 10; }
      .badge { fill: #243449; stroke: #5b748f; stroke-width: 1.5; rx: 14; }
      .badgeText { fill: #dce6f2; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; font-size: 15px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#6ed7ff"/>
    </marker>
    <marker id="arrowReturn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#ffd45a"/>
    </marker>
    <marker id="arrowLocal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#98a7ba"/>
    </marker>
  </defs>

  <rect width="1600" height="1180" class="bg"/>
  <text x="60" y="60" class="title">剪力墙智能设计插件交互时序</text>
  <text x="60" y="92" class="subtitle">左侧为 CAD 插件和工程师操作，右侧为业务后端和建模服务；骨架与结构两个阶段均允许迭代修正。</text>

  <rect x="90" y="125" width="530" height="92" class="head"/>
  <text x="135" y="163" class="title">CAD 插件 / 工程师</text>
  <text x="135" y="192" class="subtitle">选择范围、读取图元、绘制结果、人工修正</text>

  <rect x="980" y="125" width="530" height="92" class="head"/>
  <text x="1025" y="163" class="title">业务后端 / 建模服务</text>
  <text x="1025" y="192" class="subtitle">骨架提取、分区、结构设计、YJK 建模</text>

  <line x1="355" y1="235" x2="355" y2="1090" class="life"/>
  <line x1="1245" y1="235" x2="1245" y2="1090" class="life"/>

  <rect x="150" y="248" width="410" height="78" class="note"/>
  <text x="176" y="278" class="step">1. 框选平面图</text>
  <text x="176" y="306" class="small">设置墙体、门窗、轴线图层；可仅显示输入图层确认</text>

  <path d="M355 350H1245" class="arrow"/>
  <text x="525" y="337" class="text">2. extract_skeleton(raw_geometries)</text>
  <rect x="580" y="361" width="260" height="30" class="badge"/>
  <text x="604" y="382" class="badgeText">范围内墙体 / 门窗 / 轴线图元</text>

  <path d="M1245 430H355" class="return"/>
  <text x="525" y="416" class="text">3. 返回骨架结果</text>
  <rect x="584" y="441" width="300" height="30" class="badge"/>
  <text x="608" y="462" class="badgeText">墙轴线、门窗嵌入线、房间分区、诊断</text>

  <rect x="125" y="486" width="495" height="215" class="loop"/>
  <text x="148" y="518" class="step">骨架修正迭代</text>
  <path d="M230 548C205 548 205 622 230 622H355" class="local"/>
  <text x="248" y="574" class="small">4. 工程师在 CAD 中补线、删线、延长搭接</text>
  <path d="M355 645H1245" class="arrow"/>
  <text x="526" y="632" class="text">5. normalize_skeleton(edited_skeleton)</text>
  <path d="M1245 690H355" class="return"/>
  <text x="526" y="678" class="text">6. 返回更新后的房间分区和问题提示</text>

  <path d="M355 748H1245" class="arrow"/>
  <text x="525" y="735" class="text">7. design_structure(final_skeleton)</text>
  <rect x="615" y="759" width="250" height="30" class="badge"/>
  <text x="638" y="780" class="badgeText">确认后的最终骨架</text>

  <path d="M1245 818H355" class="return"/>
  <text x="525" y="805" class="text">8. 返回剪力墙、梁、楼板分区和未闭合提示</text>

  <rect x="125" y="858" width="495" height="182" class="loop"/>
  <text x="148" y="890" class="step">结构修正迭代</text>
  <path d="M230 920C205 920 205 974 230 974H355" class="local"/>
  <text x="248" y="945" class="small">9. 工程师修正剪力墙和梁</text>
  <path d="M355 985H1245" class="arrow"/>
  <text x="526" y="973" class="text">10. normalize_structure(edited_structure)</text>
  <path d="M1245 1030H355" class="return"/>
  <text x="526" y="1018" class="text">11. 返回搭接闭合检查结果</text>

  <path d="M355 1080H1245" class="arrow"/>
  <text x="525" y="1067" class="text">12. generate_ydb(final_structure)</text>
  <path d="M1245 1130H355" class="return"/>
  <text x="525" y="1117" class="text">13. 返回 YDB 文件，前端下载或写回 CAD</text>
</svg>
